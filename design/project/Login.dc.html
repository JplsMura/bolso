<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Login</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="box-sizing: border-box; min-height: 760px; padding: 24px; display: flex; align-items: center; justify-content: center; background: #0E1315; color: #E9EEEC; font-family: 'DM Sans', system-ui, sans-serif">
  <main style="width: 100%; max-width: 420px; display: flex; flex-direction: column; gap: 24px">
    <div style="display: flex; flex-direction: column; gap: 8px">
      <h1 style="margin: 0; font-size: 28px; font-weight: 700; letter-spacing: -0.5px">Entrar</h1>
      <p style="margin: 0; font-size: 15px; color: #9BA8A5; line-height: 1.5">Receba um código no seu e-mail ou entre com o Google. Sem senha para lembrar.</p>
    </div>

    <section aria-label="Entrar com código" style="background: #161C1F; border: 1px solid #2B353A; border-radius: 16px; padding: 20px; display: flex; flex-direction: column; gap: 16px">
      <div style="display: flex; flex-direction: column; gap: 6px">
        <label for="email" style="font-size: 13px; color: #9BA8A5">E-mail</label>
        <input id="email" type="text" value="voce@exemplo.com" style="height: 48px; box-sizing: border-box; padding: 0 14px; border-radius: 12px; border: 1px solid #2B353A; background: #0E1315; color: #E9EEEC; font: 400 16px 'DM Sans', system-ui, sans-serif">
      </div>
      <button style="height: 48px; border: 0; border-radius: 12px; background: #2DD4BF; color: #04231F; font: 700 16px 'DM Sans', system-ui, sans-serif">Enviar código</button>

      <div style="display: flex; flex-direction: column; gap: 10px; padding-top: 4px; border-top: 1px solid #1E2629">
        <label for="codigo" style="font-size: 13px; color: #9BA8A5; padding-top: 12px">Código de 6 dígitos que chegou no e-mail</label>
        <input id="codigo" type="text" value="482 917" style="height: 56px; box-sizing: border-box; text-align: center; letter-spacing: 6px; border-radius: 12px; border: 1px solid #2DD4BF; background: #0E1315; color: #E9EEEC; font: 700 24px 'DM Sans', system-ui, sans-serif; font-variant-numeric: tabular-nums">
        <div style="font-size: 12px; color: #9BA8A5">O código vale por poucos minutos. Não chegou? Reenviar em 30 segundos.</div>
        <a href="InicioDesktop.dc.html" style="height: 48px; border-radius: 12px; background: #2DD4BF; color: #04231F; font: 700 16px 'DM Sans', system-ui, sans-serif; display: flex; align-items: center; justify-content: center; text-decoration: none">Confirmar e entrar</a>
      </div>
    </section>

    <div style="display: flex; align-items: center; gap: 12px; color: #9BA8A5; font-size: 13px"><span style="flex: 1; height: 1px; background: #2B353A"></span>ou<span style="flex: 1; height: 1px; background: #2B353A"></span></div>

    <button style="height: 48px; border: 1px solid #2B353A; border-radius: 12px; background: #161C1F; color: #E9EEEC; font: 600 16px 'DM Sans', system-ui, sans-serif; display: flex; align-items: center; justify-content: center; gap: 10px">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg>
      Entrar com o Google
    </button>
    <p style="margin: 0; font-size: 12px; color: #9BA8A5; text-align: center">A tela mostra o fluxo inteiro de uma vez; no sistema real, o campo do código aparece só depois de enviar.</p>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":760}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
