<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Tags</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0}
a:hover{color:#E9EEEC}
</style>
</helmet>
<div style="box-sizing: border-box; min-height: 900px; display: flex; flex-wrap: wrap; background: #0E1315; color: #E9EEEC; font-family: 'DM Sans', system-ui, sans-serif">

  <nav aria-label="Principal" style="flex: 1 1 240px; max-width: 280px; box-sizing: border-box; padding: 24px 16px; border-right: 1px solid #2B353A; display: flex; flex-direction: column; gap: 24px">
    <button aria-label="Trocar de espaço, Casa" style="height: 48px; padding: 0 14px; border: 1px solid #2B353A; border-radius: 12px; background: #161C1F; color: #E9EEEC; font: 600 15px 'DM Sans', system-ui, sans-serif; display: flex; align-items: center; gap: 10px; text-align: left">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#2DD4BF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>
      <span style="flex: 1">Casa</span>
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#9BA8A5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
    </button>
    <ul style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px">
      <sc-for list="{{menu}}" as="i" hint-placeholder-count="6">
        <li><a href="InicioDesktop.dc.html" style="{{i.style}}">{{i.label}}</a></li>
      </sc-for>
    </ul>
    <a href="Config.dc.html" style="margin-top: auto; font-size: 14px; color: #9BA8A5; text-decoration: none">Configurações</a>
  </nav>

  <main style="flex: 999 1 560px; min-width: 0; box-sizing: border-box; padding: 32px; display: flex; flex-direction: column; gap: 24px">
    <header style="display: flex; flex-direction: column; gap: 4px">
      <h1 style="margin: 0; font-size: 28px; font-weight: 700; letter-spacing: -0.5px">Tags</h1>
      <span style="font-size: 14px; color: #9BA8A5">Além das 6 metas, cada gasto pode ter uma tag (Luz, Uber, Alimentação). Cada tag diz se é custo fixo ou variável.</span>
    </header>

    <section aria-label="Nova tag" style="background: #161C1F; border: 1px solid #2B353A; border-radius: 16px; padding: 16px; display: flex; flex-wrap: wrap; align-items: flex-end; gap: 12px">
      <div style="flex: 1 1 220px; display: flex; flex-direction: column; gap: 6px">
        <label for="nome" style="font-size: 13px; color: #9BA8A5">Nome da tag</label>
        <input id="nome" type="text" placeholder="Por exemplo: Academia" style="height: 44px; box-sizing: border-box; padding: 0 14px; border-radius: 12px; border: 1px solid #2B353A; background: #0E1315; color: #E9EEEC; font: 400 15px 'DM Sans', system-ui, sans-serif">
      </div>
      <div style="display: flex; background: #0E1315; border: 1px solid #2B353A; border-radius: 12px; padding: 3px; gap: 2px">
        <button aria-pressed="true" style="height: 38px; padding: 0 16px; border: 0; border-radius: 9px; background: #2DD4BF; color: #04231F; font: 700 13px 'DM Sans', system-ui, sans-serif">Custo fixo</button>
        <button aria-pressed="false" style="height: 38px; padding: 0 16px; border: 0; border-radius: 9px; background: transparent; color: #9BA8A5; font: 500 13px 'DM Sans', system-ui, sans-serif">Custo variável</button>
      </div>
      <button style="height: 44px; padding: 0 20px; border: 0; border-radius: 12px; background: #2DD4BF; color: #04231F; font: 700 15px 'DM Sans', system-ui, sans-serif">Criar tag</button>
    </section>

    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px">
      <sc-for list="{{grupos}}" as="g" hint-placeholder-count="2">
        <section style="background: #161C1F; border: 1px solid #2B353A; border-radius: 16px; padding: 8px 20px 12px 20px">
          <h2 style="margin: 12px 0 4px 0; font-size: 18px; font-weight: 600">{{g.titulo}}</h2>
          <sc-for list="{{g.tags}}" as="t" hint-placeholder-count="4">
            <div style="display: flex; justify-content: space-between; align-items: center; min-height: 48px; border-top: 1px solid #1E2629; font-size: 15px"><span style="font-weight: 500">{{t.nome}}</span><span style="font-size: 13px; color: #9BA8A5">{{t.usos}} lançamentos</span></div>
          </sc-for>
        </section>
      </sc-for>
    </div>
    <p style="margin: 0; font-size: 13px; color: #9BA8A5">Dados de exemplo.</p>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const ativo = 'display: block; padding: 12px 14px; border-radius: 10px; background: #1E2629; color: #2DD4BF; font-size: 15px; font-weight: 600; text-decoration: none';
    const normal = 'display: block; padding: 12px 14px; border-radius: 10px; color: #9BA8A5; font-size: 15px; text-decoration: none';
    const menu = ['Início', 'Lançamentos', 'Presets', 'Cartões', 'Mês', 'Tags'].map((l) => ({ label: l, style: l === 'Tags' ? ativo : normal }));
    const grupos = [
      { titulo: 'Custo fixo', tags: [ { nome: 'Luz', usos: 9 }, { nome: 'Água', usos: 9 }, { nome: 'Internet', usos: 9 }, { nome: 'Telefone', usos: 9 }, { nome: 'Streaming', usos: 7 } ] },
      { titulo: 'Custo variável', tags: [ { nome: 'Alimentação', usos: 41 }, { nome: 'Uber', usos: 18 }, { nome: 'Restaurante', usos: 12 }, { nome: 'Farmácia', usos: 6 } ] }
    ];
    return { menu, grupos };
  }
}
</script>
</body>
</html>
