# Sobe tudo: docker compose up --build   (copie .env.example para .env antes)
name: bolso

services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bolso}
      POSTGRES_USER: ${POSTGRES_USER:-bolso}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
      TZ: UTC
    ports:
      - "127.0.0.1:5432:5432" # só nesta máquina
    volumes:
      - db-data:/var/lib/postgresql # PostgreSQL 18+ guarda em /var/lib/postgresql/18/docker
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  api:
    build: ./backend
    environment:
      DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-bolso}
      DB_USER: ${POSTGRES_USER:-bolso}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:8080:8080" # só nesta máquina: sem login, quem chega aqui é o dono
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  web:
    build: ./frontend
    ports:
      - "127.0.0.1:5173:80" # só nesta máquina
    depends_on:
      - api
    restart: unless-stopped

  # Front com recarregamento automático (servidor de desenvolvimento do Vite, lendo ./frontend direto).
  # Só sobe quando pedido: docker compose --profile dev up -d web-dev   → http://localhost:5174
  web-dev:
    profiles: ["dev"]
    image: node:24-alpine
    working_dir: /app
    # npm ci só na primeira vez (ou quando o package-lock.json mudar); depois, direto o Vite
    command: >
      sh -c "cmp -s package-lock.json node_modules/.lock-copia 2>/dev/null
      || (npm ci && cp package-lock.json node_modules/.lock-copia);
      npm run dev -- --host 0.0.0.0"
    environment:
      VITE_API_PROXY: http://api:8080
      VITE_POLLING: "true"
    volumes:
      - ./frontend:/app
      - web-dev-node-modules:/app/node_modules # os pacotes do Linux ficam no contêiner, não na sua pasta
    ports:
      - "127.0.0.1:5174:5173" # só nesta máquina
    depends_on:
      - api

  backup:
    image: postgres:18-alpine
    environment:
      PGHOST: db
      PGDATABASE: ${POSTGRES_DB:-bolso}
      PGUSER: ${POSTGRES_USER:-bolso}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      BACKUP_RETENCAO_DIAS: ${BACKUP_RETENCAO_DIAS:-30}
      TZ: America/Sao_Paulo
    volumes:
      - ./backups:/backups
      - ./infra/backup/backup.sh:/backup.sh:ro
    entrypoint: ["sh", "/backup.sh"]
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  db-data:
  web-dev-node-modules:
